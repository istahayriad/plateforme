.enveloppe{max-width:900px; margin:0 auto; padding:18px 16px 60px;}
header.tete{display:flex; align-items:center; gap:12px; padding-bottom:14px; border-bottom:1px solid var(--ligne); flex-wrap:wrap;}
header.tete .txt{flex:1 1 200px;}
header.tete h1{font-family:'Archivo',sans-serif; font-size:18px; font-weight:800; margin:0;}
header.tete p{margin:2px 0 0; font-size:12px; color:var(--encre-doux);}
button{font-family:inherit; cursor:pointer;}
.choix{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-top:26px;}
.choix-seule{max-width:320px; margin-left:auto; margin-right:auto;}
.porte{background:var(--carte); border:1px solid var(--ligne); border-radius:16px; padding:26px 22px; text-align:left; font:inherit; color:inherit; box-shadow:var(--ombre);}
.porte .pict{font-size:34px; line-height:1;}
.porte h2{font-family:'Archivo',sans-serif; font-size:18px; margin:10px 0 4px;}
.porte p{margin:0; font-size:13px; color:var(--encre-doux);}

/* ---- Agent : très gros, très peu de texte ---- */
.pin{max-width:340px; margin:60px auto; text-align:center;}
.pin h2{font-family:'Archivo',sans-serif; font-size:20px;}
.pinBoites{display:flex; gap:10px; justify-content:center; margin:20px 0;}
.pinBoites input{width:52px; height:64px; text-align:center; font-size:28px; border:2px solid var(--ligne); border-radius:12px; background:var(--carte); color:var(--encre);}
.gros{width:100%; padding:20px; font-size:20px; font-weight:700; border-radius:14px; border:none; background:var(--vert); color:#fff; box-shadow:var(--ombre);}
.jourBandeau{background:var(--carte); border:1px solid var(--ligne); border-radius:16px; padding:18px; text-align:center; box-shadow:var(--ombre); margin-top:14px;}
.jourBandeau .date{font-family:'Archivo',sans-serif; font-size:20px; font-weight:800;}
.jourBandeau .heure{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; color:var(--vert); margin-top:4px;}
.creneaux{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:16px;}
.creneaux button{padding:22px 8px; border-radius:16px; border:2px solid var(--ligne); background:var(--carte); font-size:16px; font-weight:700; box-shadow:var(--ombre); color:var(--encre);}
.creneaux button .h{display:block; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:500; color:var(--encre-doux); margin-top:2px;}
.creneaux button.actuel{border-color:var(--vert); background:var(--vert-doux); color:var(--vert);}
.compteur{text-align:center; font-size:14px; color:var(--encre-doux); margin:14px 0 4px;}
.ligneF{background:var(--carte); border:1px solid var(--ligne); border-radius:16px; padding:16px; margin-top:12px; box-shadow:var(--ombre);}
.ligneF .cadreSalle{display:flex; align-items:center; gap:12px;}
.salleBadge{flex:none; width:54px; height:54px; border-radius:14px; background:var(--bleu-doux); color:var(--bleu);
  display:flex; align-items:center; justify-content:center; font-family:'Archivo',sans-serif; font-size:21px; font-weight:800;}
.salleBadge.fad{background:var(--vert-doux); color:var(--vert); font-size:14px;}
.salleTxt{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--encre-doux);}
.ligneF .nom{font-family:'Archivo',sans-serif; font-size:19px; font-weight:800; margin-top:10px;}
.ligneF .det{font-size:13px; color:var(--encre-doux); margin-top:2px;}
.ligneF .boutons{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
.voletLabel{font-size:12px; font-weight:700; color:var(--encre-doux); margin-top:14px;}
.grille25{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:6px;}
.grilleSalles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px;}
.tuileSalle{display:flex; align-items:center; justify-content:center; padding:20px 4px;
  border-radius:14px; border:2px solid var(--ligne); background:var(--carte); box-shadow:var(--ombre); min-height:64px;}
.tuileSalle .num{font-family:'Archivo',sans-serif; font-size:22px; font-weight:800; color:var(--encre);}
.tuileSalle.faite{border-color:var(--vert); background:var(--vert);}
.tuileSalle.faite .num{color:#fff;}
.tuileSalle.fad{border-style:dashed;}
.pairVA{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
.pairVA .valider{padding:18px 6px; border-radius:14px; border:none; background:var(--vert); color:#fff; font-size:17px; font-weight:800; box-shadow:var(--ombre);}
.pairVA .annuler{padding:18px 6px; border-radius:14px; border:2px solid var(--ligne); background:var(--carte); color:var(--encre-doux); font-size:17px; font-weight:800;}
.grille25 .nb{padding:12px 0; border-radius:9px; border:2px solid var(--ligne); background:var(--carte); font-size:15px; font-weight:700; color:var(--encre);}
.grille25 .nb.on{border-color:var(--vert); background:var(--vert); color:#fff;}
.collectif{width:100%; margin-top:12px; padding:15px; border-radius:12px; border:2px solid var(--ligne); background:var(--carte); font-size:15px; font-weight:700; color:var(--encre-doux);}
.collectif.on{border-color:var(--rouge); background:var(--rouge); color:#fff;}
.bp,.ba{padding:18px 6px; border-radius:12px; border:2px solid var(--ligne); background:var(--carte); font-size:22px; font-weight:800; color:var(--encre-doux);}
.bp.on{border-color:var(--vert); background:var(--vert); color:#fff;}
.ba.on{border-color:var(--rouge); background:var(--rouge); color:#fff;}
.videMsg{text-align:center; padding:50px 20px; color:var(--encre-doux); font-size:16px;}
.lien-retour{display:block; text-align:center; margin-top:22px; color:var(--encre-doux); font-size:13px; background:none; border:none;}

/* ---- Responsable ---- */
.champ{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
.champ label{font-size:12px; font-weight:600; color:var(--encre-doux);}
.champ input{padding:11px 12px; border-radius:10px; border:1px solid var(--ligne); background:var(--carte); color:var(--encre); font-size:14px;}
.action{padding:11px 18px; border-radius:10px; border:none; background:var(--vert); color:#fff; font-weight:700; font-size:14px;}
.action.fantome{background:none; border:1px solid var(--ligne); color:var(--encre);}
.erreur{color:var(--rouge); font-size:12.5px;}
.onglets{display:flex; gap:8px; margin:18px 0 14px; flex-wrap:wrap;}
.onglets button{padding:9px 16px; border-radius:999px; border:1px solid var(--ligne); background:var(--carte); color:var(--encre); font-size:13px; font-weight:600;}
.onglets button.on{background:var(--encre); color:var(--papier); border-color:var(--encre);}
table.pointage{width:100%; border-collapse:collapse; font-size:13px; background:var(--carte); border-radius:14px; overflow:hidden; box-shadow:var(--ombre);}
table.pointage th{background:var(--gris-doux); padding:9px 8px; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--encre-doux);}
table.pointage td{padding:9px 8px; border-top:1px solid var(--ligne);}
.etat{display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:999px; font-size:12px; font-weight:700;}
.etat.present{background:var(--vert-doux); color:var(--vert);}
.etat.absent{background:var(--rouge-doux); color:var(--rouge);}
.etat.attente{background:var(--gris-doux); color:var(--encre-doux);}
.cadre-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.resume{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; margin-bottom:16px;}
.resume .bloc{background:var(--carte); border:1px solid var(--ligne); border-radius:12px; padding:12px; text-align:center; box-shadow:var(--ombre);}
.resume .bloc b{display:block; font-family:'Archivo',sans-serif; font-size:22px;}
.resume .bloc span{font-size:11px; color:var(--encre-doux);}
.note{font-size:12.5px; color:var(--encre-doux);}
[hidden]{display:none!important;}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ===================================================================
   ISTA HAY RIAD — application indépendante de la plateforme de consultation,
   mais sur le MÊME projet Firebase (emploi-ista-hay-riad) : elle lit les
   emplois déjà publiés (pub/meta, pub/s<n>) et écrit dans une collection à
   elle (pointage/s<n>, indexée par groupe).
   Accès agent : code à 4 chiffres, une ligne par groupe pendant la tournée.
   Accès responsable : compte Firebase du planning, état en temps réel du
   jour et de la semaine. =================== */
const $=id=>document.getElementById(id);
const FIREBASE_CONFIG={
  apiKey: "AIzaSyCgVQtJdrsIsS2bvpkqZSMH7pPJGm_IlO8",
  authDomain: "emploi-ista-hay-riad.firebaseapp.com",
  projectId: "emploi-ista-hay-riad",
  storageBucket: "emploi-ista-hay-riad.firebasestorage.app",
  messagingSenderId: "683780273492",
  appId: "1:683780273492:web:f00ef52a85898b39d504c1"
};
const ADMIN_EMAIL='achraf.elgharabi@ofppt.ma';
/* Code de l'agent — à changer ici si besoin (4 chiffres). Le responsable le
   communique de vive voix à l'agent de sécurité. */
const CODE_AGENT='2026';
const CRENEAUX=['08h30 – 11h00','11h00 – 13h30','13h30 – 16h00','16h00 – 18h30'];
const BORNES=[[8*60+30,11*60],[11*60,13*60+30],[13*60+30,16*60],[16*60,18*60+30]];
const JOURS=['lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

let fs=null, fbAuth=null;
async function ouvrirFirebase(){
  try{
    if(!window.firebase) throw new Error('SDK Firebase non chargé');
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    fs=firebase.firestore(); fbAuth=firebase.auth();
  }catch(e){ console.error('Firebase', e); fs=null; }
}
/* Chaque document est rangé en JSON texte (Firestore refuse les tableaux
   imbriqués) — même convention que la plateforme de consultation. */
const docJ=p=>fs.doc(p);
async function lireDoc(p){
  const s=await docJ(p).get();
  if(!s.exists) return null;
  const o=s.data()||{};
  if(typeof o.j==='string'){ try{ return JSON.parse(o.j); }catch(e){ return null; } }
  return o;
}
async function ecrireDoc(p, obj){ await docJ(p).set({j:JSON.stringify(obj), maj:new Date().toISOString()}); }

/* ------------------------- emplois publiés ------------------------- */
let META=null;                 // {dates, lundis, nomAff, nomFam, F, G, M, S, nbSem}
let SEMAINE_CACHE={};          // w -> sessions
async function chargerMeta(){
  META=await lireDoc('pub/meta');
  return META;
}
async function chargerSemaine(w){
  if(SEMAINE_CACHE[w]) return SEMAINE_CACHE[w];
  const d=await lireDoc('pub/s'+w);
  const s=(d && d.sessions) || [];
  SEMAINE_CACHE[w]=s;
  return s;
}
/* date locale (pas toISOString, qui décale au fuseau UTC) */
function isoLocal(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function dateDepuisIso(iso){ const d=new Date(iso+'T00:00:00'); return d; }
/* trouve la semaine (index) et le jour (0-5) d'aujourd'hui, à partir des
   lundis publiés par le générateur */
function semaineEtJourDuJour(){
  if(!META || !META.lundis || !META.lundis.length) return null;
  const auj=new Date(); auj.setHours(0,0,0,0);
  for(let w=META.lundis.length-1; w>=0; w--){
    const lundi=dateDepuisIso(META.lundis[w]);
    const diff=Math.round((auj-lundi)/86400000);
    if(diff>=0 && diff<=5) return {w, jour:diff};
  }
  return null;
}
function creneauActuel(){
  const n=new Date(); const m=n.getHours()*60+n.getMinutes();
  for(let i=0;i<BORNES.length;i++) if(m>=BORNES[i][0] && m<=BORNES[i][1]) return i;
  return -1;
}
function dateLongue(d){
  const s=JOURS[(d.getDay()+6)%7]+' '+d.getDate()+' '+MOIS[d.getMonth()]+' '+d.getFullYear();
  return s.charAt(0).toUpperCase()+s.slice(1);   // seule la première lettre, pas « Septembre »
}

/* ------------------------- navigation ------------------------- */
function vue(n){ ['Accueil','Agent','Admin'].forEach(v=>$('vue'+v).hidden=(v!==n)); }
$('porteAgent').onclick=()=>{ vue('Agent'); ouvrirAgent(); };
document.querySelectorAll('[data-retour]').forEach(b=>b.onclick=()=>vue('Accueil'));

/* ------------------------- accès responsable (lien secret) -------------------------
   Aucun bouton « Responsable » sur la page d'accueil : rien ne doit laisser
   deviner qu'un espace responsable existe. L'accès se fait uniquement par ce
   lien, à garder pour vous et à mettre en favori sur votre téléphone/PC :
       https://istahayriad.github.io/plateforme/pointage.html#direction-ihr
   Si jamais ce mot doit changer (lien vu par quelqu'un d'autre), changez la
   valeur ci-dessous ET l'adresse que vous utilisez. */
const SECRET_DIRECTION='direction-ihr';
function verifierAccesSecret(){
  if(location.hash.slice(1)===SECRET_DIRECTION){ vue('Admin'); ouvrirAdmin(); }
}
window.addEventListener('hashchange', verifierAccesSecret);

/* ------------------------- AGENT ------------------------- */
function ouvrirAgent(){
  let code=null; try{ code=localStorage.getItem('pointageCodeAgent'); }catch(e){}
  if(code===CODE_AGENT){ $('ecranPin').hidden=true; demarrerTournee(); }
  else { $('ecranPin').hidden=false; $('ecranTournee').hidden=true;
    document.querySelectorAll('.pc').forEach(i=>i.value='');
    document.querySelector('.pc').focus(); }
}
/* querySelectorAll renvoie une NodeList : pas de .every()/.map() natifs sur
   certains moteurs — on la convertit en tableau une fois pour toutes. */
const PC=[...document.querySelectorAll('.pc')];
PC.forEach((inp,i)=>{
  inp.oninput=()=>{
    inp.value=inp.value.replace(/\D/g,'').slice(0,1);
    if(inp.value && PC[i+1]) PC[i+1].focus();
    if(PC.every(x=>x.value)){
      const saisi=PC.map(x=>x.value).join('');
      if(saisi===CODE_AGENT){
        try{ localStorage.setItem('pointageCodeAgent', CODE_AGENT); }catch(e){}
        $('errPin').hidden=true; $('ecranPin').hidden=true; demarrerTournee();
      } else { $('errPin').hidden=false; PC.forEach(x=>x.value=''); PC[0].focus(); }
    }
  };
});
$('btnDeconnexionAgent').onclick=()=>{ try{ localStorage.removeItem('pointageCodeAgent'); }catch(e){} vue('Accueil'); };

let AGENT_SW=null, AGENT_JOUR=null, AGENT_CRENEAU=-1;
let AGENT_PAR_GROUPE=[];      // toutes les lignes (groupe, créneau) du jour choisi
let AGENT_SALLE=null;         // salle actuellement ouverte : 1-30, ou 'FAD'
let AGENT_ATTENTE={};         // choix pas encore validés sur l'écran salle, par groupe
let AGENT_SALLE_MARQUES={};   // pointage déjà enregistré pour la salle ouverte
async function demarrerTournee(){
  $('ecranTournee').hidden=false;
  $('listeFormateurs').innerHTML='<p class="videMsg">Chargement…</p>';
  if(!META) await chargerMeta();
  const info=semaineEtJourDuJour();
  const auj=new Date();
  $('dateAujourdhui').textContent=dateLongue(auj);
  const maj=()=>{ $('heureActuelle').textContent=auj.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); };
  maj(); setInterval(()=>{ const n=new Date(); $('heureActuelle').textContent=n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }, 30000);
  if(!info){
    $('boutonsCreneaux').innerHTML='';
    $('listeFormateurs').innerHTML='<p class="videMsg">Aucun emploi publié pour aujourd\'hui. Contactez le service planning.</p>';
    return;
  }
  AGENT_SW=info.w; AGENT_JOUR=info.jour;
  const actuel=creneauActuel();
  AGENT_CRENEAU = actuel>=0 ? actuel : 0;
  $('boutonsCreneaux').innerHTML=CRENEAUX.map((c,i)=>
    `<button data-cr="${i}" class="${i===actuel?'actuel':''}">${i+1}ᵉ créneau<span class="h">${c}</span></button>`).join('');
  $('boutonsCreneaux').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    AGENT_CRENEAU=+b.dataset.cr;
    $('boutonsCreneaux').querySelectorAll('button').forEach(x=>x.classList.toggle('actuel', x===b));
    AGENT_SALLE=null; AGENT_ATTENTE={};
    afficherSalles();
  });
  AGENT_SALLE=null; AGENT_ATTENTE={};
  afficherSalles();
}
/* Numéro de salle utilisé comme clé d'écran : 1 à 30, ou 'FAD' pour le
   distanciel (pas de salle physique). */
function clefSalle({type,salleI}){
  if(type===1) return 'FAD';
  const m=String(META.S[salleI]||'').match(/\d+/);
  return m ? +m[0] : 'AUTRE';
}
/* ÉCRAN 1 : la tournée par salle (demande du 17/09/2026) — l'agent voit les
   30 salles d'un coup d'œil, avec un repère pour celles déjà pointées, et
   touche celle où il se trouve physiquement plutôt que de faire défiler une
   longue liste de groupes triés. */
async function afficherSalles(){
  const box=$('listeFormateurs');
  box.innerHTML='<p class="videMsg">Chargement…</p>';
  const sessions=await chargerSemaine(AGENT_SW);
  const ici=sessions.filter(s=>s[1]===AGENT_JOUR && s[2]===AGENT_CRENEAU);
  const parGroupe=[];
  ici.forEach(s=>{
    const fi=s[0], type=s[3], salleI=s[4], groupesI=s[6]||[];
    groupesI.forEach(gi=>parGroupe.push({gi, fi, type, salleI}));
  });
  AGENT_PAR_GROUPE=parGroupe;
  if(!parGroupe.length){ box.innerHTML='<p class="videMsg">Aucun cours à ce créneau.</p>'; return; }
  const pointage=(await lireDoc('pointage/s'+AGENT_SW)) || {};
  const cle=AGENT_JOUR+'_'+AGENT_CRENEAU;
  const marques=(pointage[cle]) || {};
  const parSalle={};
  parGroupe.forEach(l=>{ const k=clefSalle(l); (parSalle[k]=parSalle[k]||[]).push(l); });
  const nPointees=lg=>lg.filter(l=>marques[l.gi]).length;
  /* Se référer à l'emploi : seules les salles avec un groupe réellement
     affecté à ce créneau apparaissent — plus de tuiles vides/grisées
     (demande du 17/09/2026). */
  /* Tuile blanche par défaut, verte une fois la salle entièrement validée —
     plus aucun texte sous le numéro (demande du 17/09/2026). */
  const tuiles=Array.from({length:30},(_,i)=>i+1).filter(n=>parSalle[n]).map(n=>{
    const lg=parSalle[n];
    const complet = nPointees(lg)===lg.length;
    return `<button class="tuileSalle ${complet?'faite':''}" data-salle="${n}"><span class="num">${n}</span></button>`;
  }).join('');
  const lgFad=parSalle['FAD'];
  const tuileFad = lgFad ? (()=>{ const complet=nPointees(lgFad)===lgFad.length;
      return `<button class="tuileSalle fad ${complet?'faite':''}" data-salle="FAD"><span class="num">FAD</span></button>`; })() : '';
  const total=parGroupe.length, totalPointees=parGroupe.filter(l=>marques[l.gi]).length;
  box.innerHTML = `<div class="compteur">${totalPointees} / ${total} salles traitées</div>
    <div class="grilleSalles">${tuiles}${tuileFad}</div>`;
  box.querySelectorAll('.tuileSalle[data-salle]').forEach(btn=>{
    btn.onclick=()=>{ AGENT_SALLE = btn.dataset.salle==='FAD' ? 'FAD' : +btn.dataset.salle; AGENT_ATTENTE={}; afficherSalleDetail(); };
  });
}
/* ÉCRAN 2 : détail d'une salle — une carte par groupe qui s'y trouve à ce
   créneau (le plus souvent une seule). Le choix reste LOCAL (`AGENT_ATTENTE`)
   tant que l'agent n'a pas appuyé sur Valider : Annuler l'efface sans rien
   enregistrer et laisse recommencer ; Valider écrit tout d'un coup et
   ramène à la grille des salles (demande du 17/09/2026). */
async function afficherSalleDetail(){
  const pointage=(await lireDoc('pointage/s'+AGENT_SW)) || {};
  const cle=AGENT_JOUR+'_'+AGENT_CRENEAU;
  AGENT_SALLE_MARQUES = pointage[cle] || {};
  rendreSalleDetail();
}
function rendreSalleDetail(){
  const box=$('listeFormateurs');
  const cle=AGENT_JOUR+'_'+AGENT_CRENEAU;
  const lignes=AGENT_PAR_GROUPE.filter(l=>clefSalle(l)===AGENT_SALLE);
  const labelSalle = AGENT_SALLE==='FAD' ? 'À distance' : 'Salle '+AGENT_SALLE;
  const cartes=lignes.map(({gi,fi})=>{
    const nomGroupe=(META.G[gi]||[])[0]||'groupe '+gi;
    const nomF=META.nomAff[fi]||META.F[fi]||'formateur '+fi;
    const enAttente=AGENT_ATTENTE[gi], sauve=AGENT_SALLE_MARQUES[gi];
    const etat = enAttente ? enAttente.etat : (sauve ? sauve.etat : null);
    const nbSel = enAttente ? enAttente.nb : (sauve ? sauve.nb : null);
    /* Façade « nombre d'absences » plutôt qu'un bouton Présent/Absent trop
       explicite (dissuasion, demande du 17/09/2026) : n'importe quel
       chiffre enregistre le formateur PRÉSENT ; « Absence collective »
       (toute la classe absente, cas réel et courant) l'enregistre ABSENT. */
    const grilleNb=Array.from({length:25},(_,i)=>i+1)
      .map(n=>`<button class="nb ${etat==='present'&&nbSel===n?'on':''}" data-gi="${gi}" data-fi="${fi}" data-nb="${n}">${n}</button>`).join('');
    return `<div class="ligneF" data-gi="${gi}">
      <div class="nom">${nomGroupe}</div>
      <div class="det">Formateur : ${nomF}</div>
      <div class="voletLabel">Nombre d'absence</div>
      <div class="grille25">${grilleNb}</div>
      <button class="collectif ${etat==='absent'?'on':''}" data-gi="${gi}" data-fi="${fi}">Absence collective</button>
    </div>`;
  }).join('');
  box.innerHTML = `<button class="lien-retour" id="btnRetourSalles" style="margin:0 0 10px">← retour aux salles</button>
    <div class="jourBandeau" style="margin-top:0;padding:14px"><div class="date" style="font-size:18px">${labelSalle}</div></div>
    ${cartes}
    <div class="pairVA">
      <button class="valider" id="btnValiderSalle">✔ Valider</button>
      <button class="annuler" id="btnAnnulerSalle">✗ Annuler</button>
    </div>`;
  $('btnRetourSalles').onclick=()=>{ AGENT_SALLE=null; AGENT_ATTENTE={}; afficherSalles(); };
  box.querySelectorAll('button.nb').forEach(btn=>{
    btn.onclick=()=>{ AGENT_ATTENTE[+btn.dataset.gi]={etat:'present', nb:+btn.dataset.nb, fi:+btn.dataset.fi}; rendreSalleDetail(); };
  });
  box.querySelectorAll('button.collectif').forEach(btn=>{
    btn.onclick=()=>{ AGENT_ATTENTE[+btn.dataset.gi]={etat:'absent', nb:null, fi:+btn.dataset.fi}; rendreSalleDetail(); };
  });
  $('btnAnnulerSalle').onclick=()=>{ AGENT_ATTENTE={}; AGENT_SALLE=null; afficherSalles(); };
  $('btnValiderSalle').onclick=async()=>{
    if(!Object.keys(AGENT_ATTENTE).length){ AGENT_SALLE=null; afficherSalles(); return; }
    try{
      const p=(await lireDoc('pointage/s'+AGENT_SW)) || {};
      if(!p[cle]) p[cle]={};
      Object.entries(AGENT_ATTENTE).forEach(([gi,v])=>{
        p[cle][gi]={etat:v.etat, heure:new Date().toISOString(), fi:v.fi, nb:v.nb==null?null:v.nb};
      });
      await ecrireDoc('pointage/s'+AGENT_SW, p);
      AGENT_SALLE=null; AGENT_ATTENTE={};
      afficherSalles();
    }catch(e){ alert('Enregistrement impossible : vérifiez la connexion internet.'); }
  };
}

/* ------------------------- RESPONSABLE ------------------------- */

  await ouvrirFirebase();
  if(fbAuth && fbAuth.currentUser){ $('admGate').hidden=true; $('admContenu').hidden=false; demarrerAdmin(); }
  else { $('admGate').hidden=false; $('admContenu').hidden=true; }
}

let ADMIN_UNSUB=null;
async function demarrerAdmin(){
  await ouvrirFirebase();
  if(!META) await chargerMeta();
  const info=semaineEtJourDuJour();
  if(!info){ $('admJour').innerHTML='<p class="note">Aucun emploi publié pour aujourd\'hui.</p>'; return; }
  const sessions=await chargerSemaine(info.w);
  if(ADMIN_UNSUB) ADMIN_UNSUB();
  ADMIN_UNSUB=fs.doc('pointage/s'+info.w).onSnapshot(snap=>{
    let pointage={};
    if(snap.exists){ const o=snap.data()||{}; try{ pointage=JSON.parse(o.j||'{}'); }catch(e){} }
    rendreJour(sessions, info.jour, pointage);
    rendreSemaine(sessions, pointage);
  }, err=>{ console.error(err); $('admJour').innerHTML='<p class="erreur">Lecture impossible : '+err.message+'</p>'; });
}
/* Aplatit les séances en une ligne par groupe (comme côté agent), puis lit
   l'état de présence du formateur à partir de sa/ses ligne(s) groupe. */
function lignesParGroupe(sessions){
  const l=[];
  sessions.forEach(s=>{
    const fi=s[0], jour=s[1], creneau=s[2], groupesI=s[6]||[];
    groupesI.forEach(gi=>l.push({fi, jour, creneau, gi}));
  });
  return l;
}
function rendreJour(sessions, jour, pointage){
  const auj=new Date();
  const ici=lignesParGroupe(sessions).filter(l=>l.jour===jour).sort((a,b)=>a.creneau-b.creneau || ((META.G[a.gi]||[])[0]||'').localeCompare((META.G[b.gi]||[])[0]||''));
  const marqueDe=l=>{ const c=pointage[l.jour+'_'+l.creneau]; return c && c[l.gi]; };
  const nPresent=ici.filter(l=>{ const m=marqueDe(l); return m && m.etat==='present'; }).length;
  const nAbsent=ici.filter(l=>{ const m=marqueDe(l); return m && m.etat==='absent'; }).length;
  const nAttente=ici.length-nPresent-nAbsent;
  let html=`<p class="note" style="margin-bottom:10px">${dateLongue(auj)} — mis à jour en direct.</p>
    <div class="resume">
      <div class="bloc"><b>${ici.length}</b><span>groupes prévus</span></div>
      <div class="bloc" style="color:var(--vert)"><b>${nPresent}</b><span>présents</span></div>
      <div class="bloc" style="color:var(--rouge)"><b>${nAbsent}</b><span>absents</span></div>
      <div class="bloc"><b>${nAttente}</b><span>en attente</span></div>
    </div>`;
  if(!ici.length){ html+='<p class="videMsg">Aucun cours aujourd\'hui.</p>'; $('admJour').innerHTML=html; return; }
  html+=`<div class="cadre-scroll"><table class="pointage"><tr><th>Créneau</th><th>Groupe</th><th>Formateur</th><th>État</th><th>Heure</th></tr>`;
  ici.forEach(l=>{
    const marque=marqueDe(l);
    const nom=META.nomAff[l.fi]||META.F[l.fi]||'—';
    const groupe=(META.G[l.gi]||[])[0]||'—';
    const etatTxt = !marque ? '<span class="etat attente">en attente</span>'
      : marque.etat==='present' ? '<span class="etat present">✓ présent</span>'
      : '<span class="etat absent">✗ absent</span>';
    const heure = marque ? new Date(marque.heure).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '—';
    html+=`<tr><td>${CRENEAUX[l.creneau]}</td><td>${groupe}</td><td>${nom}</td><td>${etatTxt}</td><td>${heure}</td></tr>`;
  });
  html+='</table></div>';
  $('admJour').innerHTML=html;
}
function rendreSemaine(sessions, pointage){
  const parF={};
  lignesParGroupe(sessions).forEach(l=>{
    const o=parF[l.fi]||(parF[l.fi]={prevu:0, present:0, absent:0});
    o.prevu++;
    const c=pointage[l.jour+'_'+l.creneau], m=c && c[l.gi];
    if(m && m.etat==='present') o.present++;
    else if(m && m.etat==='absent') o.absent++;
  });
  const lignes=Object.keys(parF).map(Number).sort((a,b)=>(META.nomAff[a]||'').localeCompare(META.nomAff[b]||''));
  if(!lignes.length){ $('admSemaine').innerHTML='<p class="videMsg">Aucun emploi cette semaine.</p>'; return; }
  let html=`<div class="cadre-scroll"><table class="pointage"><tr><th>Formateur</th><th>Groupes prévus</th><th>Présent</th><th>Absent</th><th>En attente</th><th>Taux</th></tr>`;
  lignes.forEach(fi=>{
    const o=parF[fi];
    const attente=o.prevu-o.present-o.absent;
    const taux=o.prevu? Math.round(100*o.present/o.prevu)+' %' : '—';
    html+=`<tr><td>${META.nomAff[fi]||META.F[fi]||'—'}</td><td>${o.prevu}</td>
      <td style="color:var(--vert);font-weight:700">${o.present}</td>
      <td style="color:var(--rouge);font-weight:700">${o.absent}</td>
      <td>${attente}</td><td>${taux}</td></tr>`;
  });
  html+='</table></div>';
  $('admSemaine').innerHTML=html;
}
